# ═══════════════════════════════════════════════════════════
#  Projet EDT — Blueprint Render (DB externe Neon)
# ═══════════════════════════════════════════════════════════

services:
  # ── API PHP (Docker) ──────────────────────────────────────
  - type: web
    name: projet-edt-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: DB_DRIVER
        value: pgsql
      - key: DATABASE_URL
        sync: false

  # ── Frontend (Static Site) ────────────────────────────────
  - type: web
    name: projet-edt-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: .
