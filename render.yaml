# ═══════════════════════════════════════════════════════════
#  Projet EDT — Blueprint Render
# ═══════════════════════════════════════════════════════════

databases:
  - name: projet-edt-db
    plan: free
    region: frankfurt
    databaseName: gestion_emploi_temps
    ipAllowList: []

services:
  # ── API PHP (Docker) ──────────────────────────────────────
  - type: web
    name: projet-edt-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: DB_DRIVER
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: projet-edt-db
          property: connectionString

  # ── Frontend (Static Site) ────────────────────────────────
  - type: web
    name: projet-edt-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: .
